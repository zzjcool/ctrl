<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>ctrl</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="rail" aria-label="会话列表">
        <div class="rail-top">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">⌃</span>
            <span class="brand-name">ctrl</span>
          </div>
          <button id="new-session" class="btn-new" type="button" title="新建会话">＋ 新对话</button>
        </div>
        <div id="session-list" class="session-list" role="list" aria-label="最近会话"></div>
        <div class="rail-foot"><span class="rail-hint">最近 30 个会话</span></div>
      </aside>

      <main class="main">
        <header class="status" aria-label="状态">
          <span class="status-item status-conn">
            <span class="dot" id="conn-dot" aria-hidden="true"></span>
            <span id="conn-text">连接中</span>
          </span>
          <span class="status-item" title="模型"><span class="status-key">model</span><span id="status-model">—</span></span>
          <span class="status-item" title="机器"><span class="status-key">machine</span><span id="status-machine">—</span></span>
          <span class="status-item" title="事件总数"><span class="status-key">events</span><span id="status-events">0</span></span>
          <span class="status-badge" id="status-resume" hidden title="会话从上次中断处恢复">已恢复</span>
          <span class="status-spacer"></span>
          <span class="status-item status-cwd" id="status-cwd" title="工作目录"></span>
        </header>

        <div id="log" class="conversation" role="log" aria-live="polite">
          <section id="empty" class="empty">
            <h1 class="empty-title">说一句，活在那头跑。</h1>
            <p class="empty-sub">对话留在这台机器，命令落在你 ssh 能到的那台机器上。</p>
            <div class="empty-prompts" aria-label="示例提示">
              <button class="prompt" type="button" data-prompt="在远端跑 go build ./...，把失败的地方列出来">
                在远端跑 <code>go build ./...</code>，把失败的地方列出来
              </button>
              <button class="prompt" type="button" data-prompt="看看当前工作目录里有什么，挑重点讲讲">
                看看当前工作目录里有什么，挑重点讲讲
              </button>
              <button class="prompt" type="button" data-prompt="读一下 README.md，用三句话总结这个项目在做什么">
                读一下 <code>README.md</code>，用三句话总结这个项目
              </button>
            </div>
          </section>
        </div>

        <form id="composer" class="composer" autocomplete="off">
          <div class="composer-box">
            <textarea
              id="input"
              class="composer-input"
              rows="1"
              placeholder="让它在远端做点什么…（Enter 发送，Shift+Enter 换行）"
              spellcheck="false"
              autocomplete="off"
            ></textarea>
            <div class="composer-row">
              <label class="machine-chip" title="机器在会话创建时绑定，切换机器 = 新会话">
                <span class="machine-chip-label">机器</span>
                <select id="machine-select" class="machine-select" disabled aria-label="机器"></select>
              </label>
              <span class="composer-spacer"></span>
              <button id="send" class="btn-send" type="submit" title="发送（Enter）">发送</button>
            </div>
          </div>
          <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
        </form>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
