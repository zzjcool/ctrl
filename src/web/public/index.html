<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>ctrl</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="head">
        <h1 class="agent-name">
          <span class="agent-mark" aria-hidden="true">⌃</span><span id="agent-name">…</span>
        </h1>
        <div class="status" aria-label="状态">
          <span class="status-item" title="这条日志里的事件总数">
            <span class="status-key">events</span>
            <span class="status-value is-mono" id="status-events">0</span>
          </span>
          <span class="status-item">
            <span class="status-key">最后活动</span>
            <span class="status-value" id="status-last">—</span>
          </span>
          <span class="status-item" title="正在跑的 pi worker 数量（来自 /api/jobs）">
            <span class="status-key">workers</span>
            <span class="status-value is-mono" id="status-workers">0</span>
          </span>
          <span class="status-item" id="status-memory-item" hidden title="它记住的条数（/api/agent 的 memory.memories）">
            <span class="status-key">记忆</span>
            <span class="status-value is-mono" id="status-memory">0</span>
            <span class="status-unit">条</span>
          </span>
          <span class="status-item" id="status-window-item" hidden title="这个窗口里的事件字符数（/api/agent 的 context.chars）">
            <span class="status-key">窗口</span>
            <span class="status-value is-mono" id="status-window">0</span>
            <span class="status-unit">字</span>
          </span>
          <span class="status-item status-resume" id="status-resume" hidden>已恢复</span>
          <span class="status-spacer"></span>
          <button
            class="panel-toggle"
            id="panel-toggle"
            type="button"
            aria-controls="aside"
            aria-expanded="false"
            title="focus 面板"
          >focus</button>
          <span class="status-item status-conn">
            <span class="dot" id="conn-dot" aria-hidden="true"></span>
            <span class="status-value" id="conn-text">连接中</span>
          </span>
        </div>
      </header>

      <main class="timeline" id="timeline" role="log" aria-live="polite" aria-label="时间线">
        <div class="load-earlier" id="load-earlier-wrap" hidden>
          <button class="btn-load" id="load-earlier" type="button">加载更早</button>
        </div>

        <section class="empty" id="empty" hidden aria-label="空状态">
          <p class="empty-line" id="empty-line"></p>
          <p class="empty-hint">日志就是它的一生：说过的话、派出去的活，都在下面按时间排着。</p>
          <div class="prompts" aria-label="示例">
            <button
              class="prompt"
              type="button"
              data-prompt="先看看当前工作目录里有什么，然后告诉我这个项目是干什么的"
            >先看看当前工作目录里有什么，然后告诉我这个项目是干什么的</button>
            <button
              class="prompt"
              type="button"
              data-prompt="把测试跑一遍，失败的地方逐个说清楚"
            >把测试跑一遍，失败的地方逐个说清楚</button>
            <button
              class="prompt"
              type="button"
              data-prompt="让 pi worker 统计一下这个仓库里有多少个 .ts 文件"
            >让 pi worker 统计一下这个仓库里有多少个 .ts 文件</button>
            <button
              class="prompt"
              type="button"
              data-prompt="记住：这个项目的测试用 node:test，不要引入别的测试框架"
            >记住：这个项目的测试用 node:test，不要引入别的测试框架</button>
          </div>
        </section>

        <div class="rows" id="rows"></div>
      </main>

      <aside class="aside" id="aside" aria-label="focus 面板">
        <div class="aside-scroll">
          <section class="panel-block">
            <h2 class="panel-title">
              <span>focus</span>
              <span class="panel-count is-mono" id="focus-count">0</span>
            </h2>
            <form class="focus-add" id="focus-add" autocomplete="off">
              <input
                class="focus-input"
                id="focus-input"
                type="text"
                maxlength="200"
                placeholder="加一条 focus，Enter 保存"
                aria-label="新建 focus"
                autocomplete="off"
              />
            </form>
            <ul class="focus-list" id="focus-list"></ul>
            <p class="panel-note" id="focus-more" hidden></p>
            <p class="panel-note" id="focus-empty" hidden>没有 focus。等它自己想起来，或者在上面写一条。</p>
            <p class="panel-note is-fail" id="focus-error" hidden>focus 拉不到：后端可能还没接上。</p>
          </section>

          <section class="panel-block">
            <h2 class="panel-title">
              <span>worker</span>
              <span class="panel-count is-mono" id="worker-count">0</span>
            </h2>
            <ul class="worker-list" id="worker-list"></ul>
            <p class="panel-note" id="worker-empty" hidden>没有正在跑的 worker。</p>
          </section>

          <section class="panel-block">
            <h2 class="panel-title"><span>memory</span></h2>
            <p class="panel-note" id="dream-line">还没做过梦</p>
          </section>
        </div>
        <div class="aside-foot">
          <button class="btn-memory" id="open-memory" type="button" title="看看它记住了什么">
            <span>记忆</span>
            <span class="btn-memory-count is-mono" id="memory-btn-count"></span>
          </button>
        </div>
      </aside>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <textarea
            class="composer-input"
            id="input"
            rows="1"
            placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"
            spellcheck="false"
            autocomplete="off"
          ></textarea>
          <div class="composer-row">
            <span class="composer-hint" id="composer-hint">Enter 发送 · Shift+Enter 换行</span>
            <button class="btn-send" id="send" type="submit">发送</button>
          </div>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      </form>

      <div class="panel-backdrop" id="panel-backdrop"></div>

      <div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="记忆" hidden>
        <div class="drawer-box">
          <div class="drawer-head">
            <span class="drawer-title">记忆</span>
            <span class="drawer-sum is-mono" id="drawer-sum"></span>
            <button class="drawer-close" id="drawer-close" type="button" aria-label="关闭">✕</button>
          </div>
          <form class="drawer-search" id="drawer-search" autocomplete="off">
            <input
              class="drawer-input"
              id="drawer-query"
              type="text"
              placeholder="搜记忆…（Enter 搜索，留空 = 全部）"
              aria-label="搜索记忆"
              autocomplete="off"
            />
            <label class="drawer-all">
              <input type="checkbox" id="drawer-all" checked />
              <span>含已合并</span>
            </label>
          </form>
          <ul class="memory-list" id="memory-list"></ul>
          <p class="panel-note" id="memory-empty" hidden>没有记忆。</p>
          <p class="panel-note is-fail" id="memory-error" hidden></p>
        </div>
      </div>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
